# Black Ops II 360 NX Campaign for the Nintendo Switch: settings
#
# This file sits next to bo2cp.nro, at sdmc:/switch/bo2zm/bo2cp.toml, and is read every time the campaign starts.
# The campaign is started from the Zombies home menu: Back, then Campaign. Its Zombies choice goes back.

# The native renderer, with the campaign shader library (bo2cp_shaders.spvpack next to bo2cp.nro).
gpu_plugin = "xenos"
bo2zm_renderer = "native"

# No log file ("off"). "info" gives the full log, for example to report a crash.
log_level = "off"

# Button layout, as in bo2zm.toml: true = by position, as on an Xbox controller.
input_xbox_layout = true

# Campaign missions are bigger than Zombies maps: smaller host stacks for the game's threads (16 MB each by default)
# and a smaller texture cache leave the heap room for the renderer's shader compiles.
guest_thread_host_stack_mb = 8
bo2zm_native_textures_mb_max = 384

# The graphics preset comes from Options > Graphics (the same setting as in Zombies; very low at first). Setting
# bo2zm_preset here would override the menu's choice at every start.

# Frames per second in the top-left corner; the graphics preset only shows for a moment after it changes.
bo2zm_show_fps = true
bo2zm_preset_on_screen = false

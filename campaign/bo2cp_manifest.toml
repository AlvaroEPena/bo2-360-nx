# Campaign bring-up (PC only): the TU18 default.xex, recompiled on its own, with no hooks yet.
# Made from ReXGlue v0.10.0's project template.

[project]
name = "bo2cp"
sdk_version = "0.10.0"
game_root = "../work/load_tu18"

[entrypoint]
file_path = "../work/load_tu18/default.xex"
out_directory_path = "generated/default"
# overrides.toml: hand-written declarations, each with its evidence.
# gaps.toml: code gaps, generated by tools/codegen_gaps.py (campaign/codegen.sh).
includes = ["overrides.toml", "gaps.toml"]

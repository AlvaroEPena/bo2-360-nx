# Black Ops II 360 NX for the Nintendo Switch: settings
#
# This file sits next to the game, at sdmc:/switch/bo2zm/bo2zm.toml, and is read every time the game starts. Each
# setting is one line, name = value. A line that starts with # is a comment: remove the # in front of a setting to
# use it, and put it back to return to the default. Many of these can also be changed in the game's own menus
# (Options > Graphics and Extras), which remember your choice; a value set in this file wins over the remembered one
# every time the game starts.
#
# The names are the same as the PC version's command-line options (--name=value), so any of those works here too.

# ---- Graphics ----------------------------------------------------------------------------------------------------

# The renderer. "native" sends the game's drawing straight to the Switch's GPU through Vulkan, using the shader library
# bo2zm_shaders.spvpack next to this file (built from your own copy of the game). The first start with a new library
# reads all of it once and saves an index beside it (bo2zm_shaders.spvidx), so later starts are quick. "xenos"
# emulates the Xbox 360's GPU instead: faithful, but far too slow to play. Leave gpu_plugin as it is.
gpu_plugin = "xenos"
bo2zm_renderer = "native"

# ---- Game --------------------------------------------------------------------------------------------------------

# Start in the Zombies menu, and bring every mode switch back to Zombies (the only mode in this port).
bo2zm_boot_zombies = true
bo2zm_zombies_only = true

# Button layout. true: the face buttons work by position, as on an Xbox controller, so the bottom button (B on a
# Switch controller) jumps and selects, the right one (A) is the Xbox B, the left one (Y) is X and the top one (X)
# is Y. false: by letter, so the Switch's A is the Xbox A.
input_xbox_layout = true

# A second controller can join Local MP or Zombies with its own offline profile.
# offline_user_count = 1
# offline_user_name_1 = "Player 2"

# ---- Online play -------------------------------------------------------------------------------------------------

# ZOMBIES MULTIPLAYER on the home menu plays over the internet with a join code. The consoles find each other through
# free public MQTT servers (the relay): each one only passes the two consoles' addresses along so they can open a path
# through their routers; the game itself goes straight between the consoles. They are all used at once, so one being
# down does not matter. If they ever stop working, put other public MQTT servers here (host:port, comma-separated,
# plain MQTT without a password). Every console in a game should use the same list.
net_online_brokers = "broker.hivemq.com:1883,broker.emqx.io:1883,broker.mqtt.cool:1883,test.mosquitto.org:1883"

# ---- Logs --------------------------------------------------------------------------------------------------------

# The game writes a log to logs/ next to it. By default it follows DEBUG in Extras: with DEBUG off only warnings and
# errors are written (enough to report a crash) and there is no profiler report (logs/rex/rex_profile.log); with
# DEBUG on the full log is written ("info", and LOG DETAIL adds the debug lines). Set log_level here to keep the full
# log and the profiler report whatever DEBUG says, for example while tracking down a problem.
# log_level = "info"
# Player builds write no log at all ("off": no log file and no profiler report). Remove this line to get the small
# warnings-and-errors log back, for example to report a crash.
log_level = "off"

# How many logs to keep, one per start (each start deletes the oldest): "5", "10" (the default), "20" or "off" to keep
# them all. MAX LOG FILES on the DEBUG page sets it too and remembers it. PURGE DEBUG INFO on the same page deletes
# old logs, screenshots and traces at once.
# bo2zm_max_log_files = "10"

# ---- Clocks ------------------------------------------------------------------------------------------------------

# The game asks for no clock changes, so the console's own clocks apply, and sys-clk (or a fork of it) can set them.
# Without sys-clk, 460 asks the system for the official 460.8 MHz handheld GPU profile that commercial games use. It is
# not an overclock, but it uses more battery and runs warmer.
# bo2zm_switch_gpu_mhz = 460

# ---- On screen ---------------------------------------------------------------------------------------------------

# Frames per second in the top-left corner. Overlays such as Status Monitor can show the game's frame rate as well.
bo2zm_show_fps = true

# Graphics preset: "lowest", "very_low" (the default), "low", "medium" (the highest) or "custom" (the settings you
# picked one by one in Options > Graphics). Lower presets trade draw distance, model detail, shadows, screen effects
# and texture sharpness for frame rate; very_low and lowest drop the shadows. A new preset applies when a map loads.
# In the menus or in a match, hold Minus and press Up for a higher preset or Down for a lower one (it wraps around);
# the new preset shows on screen for a couple of seconds. Options > Graphics sets it too and remembers it. A preset set
# here wins at every start and applies to every map (the per-map profiles of MAP PROFILE are then left out).
# bo2zm_preset = "very_low"

# Keeps the current preset in the top-right corner the whole time, menus included. false: it only shows for a couple
# of seconds after the button combination changes it. SHOW PRESET in the Graphics menu sets it too, and its
# remembered choice wins.
bo2zm_preset_on_screen = false

# Die Rise, Mob of the Dead, Buried and Origins load with the map's video (A skips it). false: the map's loading
# image, as in an online match. LOADING SCREEN VIDEO in Extras sets it too and remembers it; a value set here wins at
# every start.
# bo2zm_loading_video = true

# ---- Performance (the defaults are the tuned ones) ---------------------------------------------------------------

# The renderer makes each frame's Vulkan calls on a second thread (the "recorder") while its own thread goes on with
# the next draws. false: everything on one thread, which is slower; only useful for comparing the two.
# bo2zm_native_deferred_recording = true

# Streaming: the game's image packs (.ipak) are read at most this many MB/s in menus and while loading, about what the
# Xbox 360's disc drive allowed, and at most bo2zm_ipak_mb_s_in_match during a match. In a match the streaming pool
# is already full and the game keeps rereading the same images, so a low limit there helps: 4 MB/s gave about 4 %
# more frames in Town. 0 = no limit.
# switch_io_ipak_mb_s = 32
# bo2zm_ipak_mb_s_in_match = 4

# The job threads: which of the game's waits sleep instead of spinning, one bit each. 2047 = all of them; 1023 = all
# but the newest (a thread whose last jobs were all put back sleeps), for comparison.
# bo2zm_wait_sites = 2047

# ---- Benchmark ---------------------------------------------------------------------------------------------------

# Once Town is loaded, the game drives a fixed three-minute route by itself (put the controller down) and writes a
# "[benchmark]" summary line to the log. Run it at the console's stock clocks (sys-clk off) so results compare.
# false: you play yourself.
bo2zm_benchmark = false

# A/B inside the benchmark: two settings take turns every 5 s and the log gets a line for each, so a single run
# compares them. Factor 1 is the .ipak read rate during a match (bo2zm_benchmark_ipak_mb_s_b while it is on);
# factor 2 changes nothing by default, which shows how much the numbers vary on their own. Leave these out for normal
# play.
# bo2zm_benchmark_ab_s = 5
# bo2zm_benchmark_ipak_mb_s_b = 4

# ---- For testing and development ---------------------------------------------------------------------------------

# God mode (the game's own invulnerability on player 1). The Extras menu turns it on or off too.
# bo2zm_test_god = true

# The home menu opens SOLO and the lobby starts Town by itself, with no buttons pressed.
# bo2zm_test_start = "zm_transit town zstandard zsurvival"

# With bo2zm_benchmark: go to this round first, and start the route once the game shows it.
# bo2zm_benchmark_round = 15

# With bo2zm_benchmark: a longer route (a soak test), with the next round every this many seconds.
# bo2zm_benchmark_s = 1500
# bo2zm_benchmark_next_round_s = 120

# Stack sampling in rex_profile.log. It pauses every thread each millisecond, which costs frames and changes how the
# threads share the cores: 1 = on, 0 = off, -1 = only while logs/rex/profile_stacks.flag exists.
# bo2zm_profile_stacks = 0

# A few in-game screenshots for diagnosis, written to sdmc:/switch/bo2zm/captures/: every 30 s from 70 s after the
# start, up to 4 (Town starts drawing about a minute after launch). Each one costs a short stutter.
# bo2zm_capture_every_s = 30
# bo2zm_capture_max = 4
# bo2zm_capture_from_s = 70
